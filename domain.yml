version: "3.1"

intents:
  - greet
  - inform_profile
  - inform_health_profile
  - ask_bmi
  - ask_bmr_tdee
  - ask_bot
  - goodbye
  - ask_food_recommendation
  - ask_workout_recommendation
  - ask_bmi_history
  - nlu_fallback

entities:
  - weight
  - height
  - goal
  - activity_level
  - age
  - gender

slots:
  weight:
    type: float
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: weight

  height:
    type: float
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: height

  goal:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: goal

  activity_level:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: activity_level

  age:
    type: float
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: age

  gender:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: gender

  last_food_menu:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

responses:
  utter_greet:
    - text: "สวัสดีค่ะ 😊 ฉันเป็นแชตบอทช่วยแนะนำสุขภาพและโภชนาการเบื้องต้น"
      buttons:
        - title: "🍽️ แนะนำอาหาร"
          payload: "แนะนำอาหารหน่อย"
        - title: "🏋️‍♂️ ออกกำลังกาย"
          payload: "แนะนำการออกกำลังกายหน่อย"
        - title: "💡 BMR คืออะไร"
          payload: "bmr คืออะไร"

  utter_ask_profile:
    - text: |
        หากต้องการคำนวณ BMI หรือค่าสุขภาพครบถ้วน (BMR, TDEE, น้ำดื่ม, แคลอรี)
        กรุณากรอกข้อมูลในรูปแบบ:
        เพศ อายุ น้ำหนัก ส่วนสูง เป้าหมาย ระดับกิจกรรม
        ตัวอย่าง: ชาย 25 70 175 ลดน้ำหนัก ปานกลาง
        (หรือสั้นๆ: 52 165 ลดน้ำหนัก เบา)
    
  utter_ask_health_profile:
    - text: |
        หากต้องการคำนวณ BMR, TDEE, ปริมาณน้ำดื่ม และสารอาหารแนะนำ
        กรุณากรอกข้อมูลในรูปแบบ:
        เพศ อายุ น้ำหนัก ส่วนสูง เป้าหมาย ระดับกิจกรรม
        ตัวอย่าง: ชาย 25 70 175 ลดน้ำหนัก ปานกลาง

  utter_bmi_info:
    - text: "BMI คือค่าดัชนีมวลกาย ใช้ประเมินภาวะน้ำหนักตัวเบื้องต้นค่ะ"

  utter_bmr_tdee_info:
    - text: |
        💡 ข้อมูล BMR และ TDEE:
        • BMR (Basal Metabolic Rate): พลังงานขั้นต่ำที่ร่างกายต้องการในแต่ละวันขณะพักผ่อน
        • TDEE (Total Daily Energy Expenditure): พลังงานทั้งหมดที่ใช้ในแต่ละวัน (รวมกิจกรรมและการออกกำลังกาย)
      buttons:
        - title: "📊 คำนวณ BMR/TDEE"
          payload: "ชาย 25 70 175 ลดน้ำหนัก ปานกลาง"

  utter_goodbye:
    - text: "ขอบคุณที่ใช้งานนะคะ ดูแลสุขภาพด้วยค่ะ 😊"

  utter_default:
    - text: |
        ขออภัยค่ะ ฉันยังไม่เข้าใจสิ่งที่คุณพูด 😅
        ลองเลือกจากเมนูด้านล่างได้เลยนะคะ
      buttons:
        - title: "📊 คำนวณ BMI/สุขภาพ"
          payload: "ชาย 25 70 175 ลดน้ำหนัก ปานกลาง"
        - title: "🍽️ แนะนำอาหาร"
          payload: "แนะนำอาหารหน่อย"
        - title: "🏋️‍♂️ ออกกำลังกาย"
          payload: "แนะนำการออกกำลังกายหน่อย"
        - title: "📈 ประวัติ BMI"
          payload: "ดูประวัติ BMI หน่อย"

  utter_ask_bot:
    - text: "ฉันเป็นแชตบอทผู้ช่วยสุขภาพ ประเมิน BMI, BMR, TDEE, แนะนำอาหาร และวางตารางออกกำลังกายให้คุณค่ะ"
      buttons:
        - title: "📊 คำนวณสุขภาพ"
          payload: "ชาย 25 70 175 ลดน้ำหนัก ปานกลาง"
        - title: "🍽️ แนะนำอาหาร"
          payload: "แนะนำอาหารหน่อย"
        - title: "🏋️‍♂️ ออกกำลังกาย"
          payload: "แนะนำการออกกำลังกายหน่อย"



actions:
  - action_calculate_bmi
  - action_calculate_health_metrics
  - action_recommend_food
  - action_recommend_workout
  - action_show_bmi_history
  - action_custom_fallback
  - action_default_fallback

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true